[package]
name = "raydium-cp-swap"
version = "0.2.0"
description = "Raydium CPMM with Token2022 support"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "raydium_cp_swap"

[features]
no-entrypoint = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
enable-log = []
devnet = []
client = []

[dependencies]
anchor-spl = { git = "https://github.com/hamkj7hpo/anchor.git", rev = "733602ae380bba4fa9f5d820aa3710c62e534a4e", features = ["memo"] }
anchor-lang = { git = "https://github.com/hamkj7hpo/anchor.git", rev = "733602ae380bba4fa9f5d820aa3710c62e534a4e", features = ["init-if-needed"] }
spl-transfer-hook-interface = { git = "https://github.com/hamkj7hpo/transfer-hook.git", rev = "faeabf52625ac12e2a6cc5e7618854d8fa676d18", package = "spl-transfer-hook-interface" }
spl-token-metadata-interface = { git = "https://github.com/hamkj7hpo/token-metadata.git", rev = "f5a9a37ddbfb05df76021ada4648273be9466c8d", package = "spl-token-metadata-interface" }
spl-token-group-interface = { git = "https://github.com/hamkj7hpo/token-group.git", rev = "5442931aec8184db4c1b387be3c663fa42fccb41", package = "spl-token-group-interface" }
spl-tlv-account-resolution = { git = "https://github.com/hamkj7hpo/spl-type-length-value.git", rev = "50f00a65bf318481de4295cacb0253cc5db2ca58", package = "spl-tlv-account-resolution" }
spl-type-length-value = { git = "https://github.com/hamkj7hpo/spl-type-length-value.git", rev = "50f00a65bf318481de4295cacb0253cc5db2ca58", package = "spl-type-length-value" }
zeroize = { git = "https://github.com/hamkj7hpo/utils.git", branch = "safe-pump-compat", version = "1.3.0" }
spl-pod = { git = "https://github.com/hamkj7hpo/spl-pod.git", rev = "2bcbbd69db3cb6094beaeb28e4e0c6ae01ae6f64", package = "spl-pod", default-features = false }
solana-zk-sdk = { git = "https://github.com/hamkj7hpo/zk-elgamal-proof.git", branch = "safe-pump-compat", package = "solana-zk-sdk" }
solana-program = { git = "ssh://git@github.com/hamkj7hpo/solana.git", branch = "safe-pump-compat", version = "=1.25.0", version = "=1.25.0" }
arrayref = { git = "https://github.com/droundy/arrayref.git", branch = "master" }
bytemuck = { git = "https://github.com/Lokathor/bytemuck.git", branch = "main", features = ["derive"] }
uint = { git = "https://github.com/paritytech/parity-common.git", branch = "master" }
bincode = "1.3.3"
spl-math = "1.0.0"
spl-token-2022 = "1.0.0"

[dev-dependencies]
# Empty to avoid transitive conflicts

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = true

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
